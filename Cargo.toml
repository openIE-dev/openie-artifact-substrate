[workspace]
resolver = "2"
members = [
    "crates/openie-wai-adapter",
    "crates/openie-gates",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openIE-dev/openie-artifact-substrate"
authors = ["Open Interface Engineering <opensource@openie.dev>"]

[workspace.dependencies]
blake3 = "1.8"
ed25519-dalek = "2.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
ruzstd = "0.7"
